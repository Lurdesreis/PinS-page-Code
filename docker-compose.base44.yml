services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.base44
    ports:
      - "3000:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
